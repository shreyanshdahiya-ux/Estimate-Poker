<template>
  <lightning-card title="My Estimation Rooms" icon-name="custom:custom63">
    <lightning-button-icon
      slot="actions"
      icon-name="utility:refresh"
      alternative-text="Refresh"
      title="Refresh"
      variant="border-filled"
      onclick={handleRefreshClick}
      class="slds-m-right_xx-small"
      disabled={isLoading}
    >
    </lightning-button-icon>
    <template lwc:if={canCreateRoom}>
      <lightning-button
        slot="actions"
        label="New Room"
        variant="brand"
        icon-name="utility:add"
        onclick={handleCreateRoom}
      >
      </lightning-button>
    </template>

    <!-- Loading State -->
    <template lwc:if={isLoading}>
      <div class="slds-align_absolute-center slds-p-around_large">
        <lightning-spinner
          alternative-text="Loading"
          size="medium"
        ></lightning-spinner>
      </div>
    </template>

    <!-- Empty State -->
    <template lwc:if={isEmpty}>
      <div class="empty-state slds-align_absolute-center slds-p-around_large">
        <div class="slds-text-align_center">
          <lightning-icon
            icon-name="utility:groups"
            size="large"
            class="slds-m-bottom_medium"
          ></lightning-icon>
          <h2 class="slds-text-heading_medium slds-m-bottom_small">
            No Rooms Yet
          </h2>
          <template lwc:if={canCreateRoom}>
            <p class="slds-text-body_regular slds-m-bottom_medium">
              Create your first estimation room to get started with Planning
              Poker.
            </p>
            <lightning-button
              label="Create Your First Room"
              variant="brand"
              icon-name="utility:add"
              onclick={handleCreateRoom}
            >
            </lightning-button>
          </template>
          <template lwc:else>
            <p class="slds-text-body_regular slds-m-bottom_medium">
              You haven't been added to any rooms yet. A facilitator can add you
              to a room.
            </p>
          </template>
        </div>
      </div>
    </template>

    <!-- Room Cards -->
    <template lwc:if={hasRooms}>
      <!-- Filters -->
      <div class="slds-p-around_small slds-border_bottom">
        <div class="slds-grid slds-gutters">
          <div class="slds-col slds-size_1-of-3">
            <lightning-input
              type="search"
              label="Search Rooms"
              placeholder="Search by name..."
              value={searchTerm}
              onchange={handleSearch}
            >
            </lightning-input>
          </div>
          <div class="slds-col slds-size_1-of-3">
            <lightning-combobox
              label="Status"
              value={statusFilter}
              options={statusOptions}
              onchange={handleStatusFilter}
            >
            </lightning-combobox>
          </div>
        </div>
      </div>

      <!-- Room Grid -->
      <div class="room-grid slds-p-around_medium">
        <template for:each={filteredRooms} for:item="room">
          <div
            key={room.id}
            class="room-card slds-box slds-m-bottom_small"
            onclick={handleRoomClick}
            data-room-id={room.id}
          >
            <div class="slds-grid slds-grid_vertical-align-start">
              <div class="slds-col slds-grow">
                <div
                  class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small"
                >
                  <span class={room.statusClass}>{room.status}</span>
                  <span
                    class="room-code slds-m-left_small slds-text-body_small slds-text-color_weak"
                    >{room.roomCode}</span>
                </div>
                <h3 class="slds-text-heading_small slds-m-bottom_xx-small">
                  {room.name}
                </h3>
                <p
                  class="slds-text-body_small slds-text-color_weak slds-truncate"
                >
                  {room.description}
                </p>
              </div>
              <div class="slds-col slds-shrink-none slds-text-align_right">
                <lightning-icon
                  icon-name="utility:chevronright"
                  size="x-small"
                ></lightning-icon>
              </div>
            </div>

            <div
              class="room-meta slds-grid slds-m-top_small slds-text-body_small"
            >
              <div class="slds-col">
                <lightning-icon
                  icon-name="utility:user"
                  size="xx-small"
                  class="slds-m-right_xx-small"
                ></lightning-icon>
                {room.memberCount} members
              </div>
              <div class="slds-col">
                <lightning-icon
                  icon-name="utility:task"
                  size="xx-small"
                  class="slds-m-right_xx-small"
                ></lightning-icon>
                {room.storyCount} stories
              </div>
              <div class="slds-col">
                <lightning-icon
                  icon-name="utility:date_time"
                  size="xx-small"
                  class="slds-m-right_xx-small"
                ></lightning-icon>
                {room.formattedDate}
              </div>
            </div>

            <div
              class="room-footer slds-m-top_small slds-text-body_small slds-text-color_weak"
            >
              <span>Facilitator: {room.facilitator}</span>
              <span>Scale: {room.estimationScale}</span>
              <span>Your role: {room.myRole}</span>
            </div>
          </div>
        </template>
      </div>
    </template>
  </lightning-card>
</template>
