<template>
    <div class="vote-results">
        <div class="results-header">
            <lightning-icon icon-name="utility:chart" size="small"></lightning-icon>
            <h3>Vote Results</h3>
        </div>

        <!-- Statistics Summary -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">
                    <lightning-icon icon-name="utility:trending" size="x-small"></lightning-icon>
                </div>
                <div class="stat-content">
                    <p class="stat-value">{formattedStatistics.average}</p>
                    <p class="stat-label">Average</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <lightning-icon icon-name="utility:middle_align" size="x-small"></lightning-icon>
                </div>
                <div class="stat-content">
                    <p class="stat-value">{formattedStatistics.median}</p>
                    <p class="stat-label">Median</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <lightning-icon icon-name="utility:down" size="x-small"></lightning-icon>
                </div>
                <div class="stat-content">
                    <p class="stat-value">{formattedStatistics.min}</p>
                    <p class="stat-label">Min</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <lightning-icon icon-name="utility:up" size="x-small"></lightning-icon>
                </div>
                <div class="stat-content">
                    <p class="stat-value">{formattedStatistics.max}</p>
                    <p class="stat-label">Max</p>
                </div>
            </div>
        </div>

        <!-- Consensus Indicator -->
        <template lwc:if={hasConsensus}>
            <div class="consensus-banner">
                <lightning-icon icon-name="utility:success" size="small"></lightning-icon>
                <div class="banner-content">
                    <span class="banner-title">Perfect Consensus!</span>
                    <span class="banner-subtitle">All team members agree</span>
                </div>
            </div>
        </template>

        <!-- Variance Indicator -->
        <template lwc:if={hasHighVariance}>
            <div class="variance-banner">
                <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                <div class="banner-content">
                    <span class="banner-title">{varianceMessage}</span>
                    <span class="banner-subtitle">Range: {formattedStatistics.range}</span>
                </div>
            </div>
        </template>

        <!-- Vote Distribution Chart -->
        <template lwc:if={hasDistribution}>
            <div class="distribution-section">
                <!-- Stats Card -->
                <div class="stats-card">
                    <div class="card-header">
                        <h3>Distribution</h3>
                        <div class="view-toggles">
                            <button class={isBarView} onclick={handleViewChange} data-view="bar" title="Bar Chart">
                                <lightning-icon icon-name="utility:chart" size="x-small"></lightning-icon>
                            </button>
                            <button class={isPieView} onclick={handleViewChange} data-view="pie" title="Pie Chart">
                                <lightning-icon icon-name="utility:record" size="x-small"></lightning-icon>
                            </button>
                        </div>
                    </div>

                    <template lwc:if={hasDistribution}>
                        <!-- Bar View -->
                        <template lwc:if={isBarView}>
                            <div class="chart-container">
                                <template for:each={distributionData} for:item="bar">
                                    <div key={bar.value} class="chart-row">
                                        <div class="bar-label">{bar.value}</div>
                                        <div class="bar-track">
                                            <div class={bar.barClass} style={bar.barStyle}></div>
                                        </div>
                                        <div class="bar-value">{bar.count}</div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- Pie View -->
                        <template lwc:if={isPieView}>
                            <div class="pie-container">
                                <div class="pie-chart" style={pieChartStyle}></div>
                                <div class="pie-legend">
                                    <template for:each={distributionData} for:item="item">
                                        <div key={item.value} class="legend-item">
                                            <span class="legend-dot"></span>
                                            <span class="legend-label">{item.value}</span>
                                            <span class="legend-count">({item.count})</span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </template>
                    <template lwc:else>
                        <p class="no-data">No votes yet</p>
                    </template>
                </div>
            </div>

            <!-- Insights Row -->
            <div class="slds-grid slds-wrap slds-gutters slds-m-top_medium">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <div class="stats-card insight-card">
                        <div class="insight-icon fastest">⚡</div>
                        <div class="insight-content">
                            <h3>Fastest Finger</h3>
                            <div class="insight-person">
                                <template lwc:if={firstVoter}>
                                    <lightning-avatar src={firstVoter.voterPhoto} fallback-icon-name="standard:user"
                                        size="small"></lightning-avatar>
                                    <span>{firstVoter.voterName}</span>
                                </template>
                                <template lwc:else>-</template>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <div class="stats-card insight-card">
                        <div class="insight-icon slowest">🐢</div>
                        <div class="insight-content">
                            <h3>Last Call</h3>
                            <div class="insight-person">
                                <template lwc:if={lastVoter}>
                                    <lightning-avatar src={lastVoter.voterPhoto} fallback-icon-name="standard:user"
                                        size="small"></lightning-avatar>
                                    <span>{lastVoter.voterName}</span>
                                </template>
                                <template lwc:else>-</template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- Individual Votes -->
        <template lwc:if={hasVotes}>
            <div class="individual-votes">
                <h4 class="section-title">
                    <lightning-icon icon-name="utility:people" size="xx-small"></lightning-icon>
                    Individual Votes
                </h4>
                <div class="votes-grid">
                    <template for:each={formattedVotes} for:item="vote">
                        <div key={vote.odataUserId} class={vote.cardClass}>
                            <div class="vote-card-inner">
                                <div class="voter-header">
                                    <lightning-avatar src={vote.voterPhoto} fallback-icon-name="standard:user"
                                        size="medium" class="avatar-center">
                                    </lightning-avatar>
                                    <div class="voter-meta">
                                        <p class="voter-name">{vote.voterName}</p>
                                        <template lwc:if={vote.duration}>
                                            <span class="voter-time">
                                                <lightning-icon icon-name="utility:clock" size="xx-small"
                                                    class="slds-m-right_xxx-small"></lightning-icon>
                                                {vote.duration}
                                            </span>
                                        </template>
                                    </div>
                                </div>
                                <div class="vote-value-container">
                                    <div class="vote-value-display">
                                        <span class="vote-value">{vote.value}</span>
                                    </div>
                                </div>
                                <template lwc:if={vote.hasComment}>
                                    <div class="vote-comment-alt">
                                        <lightning-icon icon-name="utility:comments" size="xx-small"></lightning-icon>
                                        <span class="comment-text">{vote.comment}</span>
                                    </div>
                                </template>
                                <template lwc:if={vote.isOutlier}>
                                    <div class="outlier-tag">
                                        <lightning-icon icon-name="utility:warning" size="xx-small"></lightning-icon>
                                        <span>Outlier</span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- Outlier Warning -->
        <template lwc:if={hasOutliers}>
            <div class="outlier-warning">
                <lightning-icon icon-name="utility:warning" size="small"></lightning-icon>
                <div class="warning-content">
                    <span class="warning-title">Significant Variance Detected</span>
                    <span class="warning-subtitle">Some votes differ significantly from the average. Consider discussion
                        before finalizing the estimate.</span>
                </div>
            </div>
        </template>
    </div>
</template>
